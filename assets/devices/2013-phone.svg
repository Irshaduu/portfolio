<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 277 679" preserveAspectRatio="none">
  <!-- 2013's phone, around the live apps' phone screen (css/eras/2013.css): space grey aluminium,
       a polished edge, black glass, and a home button with a steel ring. Units match the page's:
       the screen sits at 14, 62, 249 x 539, and the CSS stretches this drawing to the phone's box. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9ea4"/>
      <stop offset=".35" stop-color="#5f6369"/>
      <stop offset=".7" stop-color="#45484d"/>
      <stop offset="1" stop-color="#2f3236"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".4" stop-color="#c9ccd0"/>
      <stop offset=".6" stop-color="#7d8187"/>
      <stop offset="1" stop-color="#e9ebee"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1e21"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f2f4"/>
      <stop offset=".5" stop-color="#8d9197"/>
      <stop offset="1" stop-color="#e2e4e7"/>
    </linearGradient>
    <radialGradient id="button" cx=".5" cy=".3" r=".75">
      <stop offset="0" stop-color="#2a2b2e"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </radialGradient>
  </defs>

  <!-- The aluminium band, its polished edge, and the glass inside them. -->
  <rect width="277" height="679" rx="42" fill="url(#band)"/>
  <rect x="1.4" y="1.4" width="274.2" height="676.2" rx="40.6" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
  <rect x="3" y="3" width="271" height="673" rx="39" fill="url(#glass)"/>
  <path d="M42 3H120L3 220V42A39 39 0 0 1 42 3Z" fill="#fff" opacity=".035"/>

  <!-- The display's black edge, under the glass. -->
  <rect x="12" y="60" width="253" height="543" fill="#050506"/>

  <!-- Camera above the earpiece. -->
  <circle cx="138.5" cy="19" r="3.4" fill="#0b0d12" stroke="#2a2d33" stroke-width=".8"/>
  <circle cx="137.6" cy="18.1" r="1" fill="#7a98c0" opacity=".7"/>
  <rect x="117.5" y="33" width="42" height="5.5" rx="2.75" fill="#1f2124" stroke="#3a3d41" stroke-width=".8"/>
  <rect x="120" y="34.6" width="37" height="1" rx=".5" fill="#fff" opacity=".06"/>

  <!-- The home button: a steel ring around a dark, slightly hollow key. -->
  <circle cx="138.5" cy="640" r="23" fill="url(#steel)"/>
  <circle cx="138.5" cy="640" r="21.2" fill="url(#button)"/>
  <path d="M120 636a18.6 18.6 0 0 1 37 0" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.2"/>
</svg>
