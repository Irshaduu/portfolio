# The assistant's server, as Cloudflare runs it. `npm run deploy` sends it there.
# The API keys are not here: they are secrets, set once with `npx wrangler secret put` (see README.md).

name = "portfolio-assistant"
main = "worker/index.js"
compatibility_date = "2026-09-20"

# No preview copies at <version>-portfolio-assistant.irshaduu.workers.dev: each would be a second
# door to the same keys and free AI allowance. (Cloudflare offers none anyway for a Worker with a
# Durable Object, like the Relay.) To judge one AI alone, the exam can ask it directly: EXAM_ONLY=GLM.
preview_urls = false

# Logs in the Cloudflare dashboard: which service answered each question, and how fast.
[observability]
enabled = true

[vars]
# The pages allowed to ask: the live portfolio, and the local servers (node tools/serve.mjs, on 4173 or 4174).
ALLOWED_ORIGINS = "https://irshaduu.github.io,http://localhost:4173,http://127.0.0.1:4173,http://localhost:4174,http://127.0.0.1:4174"
# The models, in the order they're asked (worker/chain.js). Check your free limits for each in
# Google AI Studio and the Groq console; change a name here and deploy again to switch.
# GEMINI_THINKING: how much the first Gemini model thinks before answering. "minimal" is fastest,
# where the model allows it (gemini-3.8-flash refuses it: use "low" there).
# GEMINI_RESERVE_MODEL: a second full Flash, asked when the first is busy or out for the day. Each
# model has its own free allowance, so it doubles the full-power answers. It thinks "low".
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_THINKING = "minimal"
GEMINI_RESERVE_MODEL = "gemini-3.8-flash"
GEMINI_LITE_MODEL = "gemini-3.5-flash-lite"
GROQ_MODEL = "openai/gpt-oss-120b"
# GLM on Workers AI (the AI binding below): 10,000 free neurons a day, no key, no card.
GLM_MODEL = "@cf/zai-org/glm-4.7-flash"

# The Relay (worker/index.js): the AI services are called from a Durable Object kept in western North
# America, so Gemini never sees a request from a place it doesn't serve.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# Workers AI, for GLM: answers from inside Cloudflare.
[ai]
binding = "AI"
