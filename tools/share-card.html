<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<!--
  The picture WhatsApp, LinkedIn and others show when the link is shared: assets/share.png, 1200 x 630.
  It is this page, photographed. After changing it, run tools/serve.mjs and then, from the project folder:

  "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=10000 --screenshot="%CD%\assets\share.png" http://localhost:4173/tools/share-card.html

  Then bump the ?v= on the og:image in index.html, so WhatsApp, LinkedIn and Facebook fetch it again.

  WhatsApp often shows only the middle square (x 285 to 915), as a small thumbnail beside the title.
  So everything that matters sits inside that square, and nothing in it looks like a row of product
  cards: the name, the role, and the time machine.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300&family=Geist:wght@400&family=Geist+Mono:wght@500&family=Orbitron:wght@500&family=Nunito:wght@900&family=Lato:wght@300&family=Inter:wght@700&family=Sora:wght@200&display=block">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, h1, p, ol { margin: 0; padding: 0; }
  body {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #04050a; color: #e9edf6; font: 400 24px/1.3 "Geist", system-ui, sans-serif;
  }

  /* ---- the 2026 sky: aurora, a light behind the name, a floor of points ---- */
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(70% 55% at 88% -12%, rgb(184 164 255 / .2), transparent 70%),
      radial-gradient(55% 45% at -8% 108%, rgb(125 243 255 / .13), transparent 70%),
      radial-gradient(420px 300px at 50% 42%, rgb(125 243 255 / .07), transparent 70%);
  }
  .floor {
    position: absolute; left: -40%; right: -40%; top: 60%; bottom: -30%;
    background-image: radial-gradient(rgb(200 212 255 / .26) 1px, transparent 1.4px); background-size: 34px 34px;
    transform: perspective(700px) rotateX(64deg); transform-origin: 50% 0;
    mask-image: linear-gradient(180deg, transparent, #000 30%, transparent 85%); opacity: .7;
  }
  .url { position: absolute; right: 40px; top: 40px; font: 500 13px/1 "Geist Mono", monospace; letter-spacing: .04em; color: #697186; } /* clear of the middle square */

  /* ---- who: the masthead, centred ---- */
  .who { position: absolute; left: 285px; width: 630px; top: 84px; display: grid; justify-items: center; text-align: center; }
  .kicker { display: flex; align-items: center; gap: 16px; font: 500 17px/1 "Geist Mono", monospace; letter-spacing: .26em; text-transform: uppercase; color: #7df3ff; }
  .kicker::before, .kicker::after { content: ""; width: 34px; height: 1px; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .kicker::after { margin-left: -.26em; } /* the letter-spacing after the last letter */
  h1 { margin-top: 26px; display: grid; font: 300 82px/.96 "Unbounded", sans-serif; letter-spacing: -.04em; }
  h1 span:last-child {
    padding-bottom: .08em;
    background: linear-gradient(100deg, #e9edf6 5%, #7df3ff 48%, #b8a4ff 92%); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .role { margin-top: 22px; font-size: 25px; color: #a3acc0; }

  /* ---- the time machine: each year written the way the web of that year wrote ---- */
  .tm { position: absolute; left: 300px; width: 600px; top: 452px; }
  .tm p { text-align: center; font-size: 19px; color: #697186; }
  .tm p b { font-weight: 400; color: #a3acc0; }
  ol { position: relative; margin-top: 24px; display: flex; justify-content: space-between; list-style: none; }
  ol::before, ol::after { content: ""; position: absolute; top: 4px; left: 36px; height: 2px; border-radius: 2px; }
  ol::before { right: 36px; background: rgb(170 190 255 / .2); }
  ol::after { width: calc((100% - 72px) * 6 / 7); background: linear-gradient(90deg, #b8a4ff, #7df3ff); }
  li { position: relative; width: 72px; display: grid; justify-items: center; align-content: start; gap: 16px; }
  li::before { content: ""; position: relative; z-index: 1; width: 10px; height: 10px; border-radius: 50%; background: #2a3045; }
  li.now::before { margin-block: -6px; width: 22px; height: 22px; background: #fff; border: 5px solid #04050a; box-shadow: 0 0 0 2px #7df3ff, 0 0 22px #7df3ff; }
  li b { display: block; font-weight: 400; line-height: 1; white-space: nowrap; }

  .y1992 b { font: 21px/1 "Times New Roman", Times, serif; color: #8fa0ff; text-decoration: underline; text-underline-offset: 3px; }
  .y1997 b {
    font: 23px/1 Impact, "Arial Black", sans-serif; letter-spacing: .5px;
    background: linear-gradient(90deg, #f33, #ff8000, #ff0, #0f0, #0ff, #39f, #f0f); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .y2001 b {
    font: 500 18px/1 "Orbitron", sans-serif; letter-spacing: .02em;
    background: linear-gradient(180deg, #fff 0%, #e8edf2 46%, #a3adb8 54%, #d3dae1 74%, #fff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 6px rgb(63 169 245 / .55));
  }
  .y2007 b { font: 900 22px/1 "Nunito", sans-serif; letter-spacing: -.03em; color: #4aa8f0; -webkit-box-reflect: below 0 linear-gradient(transparent 45%, rgb(255 255 255 / .3)); }
  .y2013 b { font: 300 21px/1 "Lato", sans-serif; letter-spacing: .06em; color: #fff; text-shadow: 1px 1px #16a085, 2px 2px #16a085, 3px 3px #16a085, 4px 4px #16a085, 5px 5px #16a085; }
  .y2023 b {
    font: 700 21px/1 "Inter", sans-serif; letter-spacing: -.04em;
    background: linear-gradient(180deg, #fff 30%, #a1a1aa); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .y2026 b { font: 300 19px/1 "Unbounded", sans-serif; letter-spacing: -.02em; color: #7df3ff; text-shadow: 0 0 14px rgb(125 243 255 / .6); }
  .y2030 b {
    font: 200 23px/1 "Sora", sans-serif; letter-spacing: -.03em;
    background: linear-gradient(100deg, #9fe8ff, #9dffd6 33%, #ffd28a 66%, #ff8fb8); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px rgb(159 232 255 / .45));
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="floor"></div>
  <p class="url">irshaduu.github.io/portfolio</p>

  <header class="who">
    <p class="kicker">Portfolio</p>
    <h1><span>Mohammed</span><span>Irshad C</span></h1>
    <p class="role">Python Developer · Django, backend &amp; full-stack</p>
  </header>

  <div class="tm">
    <p>This site, <b>styled like the web of each year</b>. Drag to time travel.</p>
    <ol>
      <li class="y1992"><b>1992</b></li>
      <li class="y1997"><b>1997</b></li>
      <li class="y2001"><b>2001</b></li>
      <li class="y2007"><b>2007</b></li>
      <li class="y2013"><b>2013</b></li>
      <li class="y2023"><b>2023</b></li>
      <li class="y2026 now"><b>2026</b></li>
      <li class="y2030"><b>2030</b></li>
    </ol>
  </div>
</body>
</html>
